services:
  postgres:
    image: postgres:16-alpine
    container_name: zkdoc-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zkdoc}
      POSTGRES_USER: ${POSTGRES_USER:-zkdoc_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zkdoc_local_dev_secret}
    ports:
      # Bound to localhost only to prevent external network exposure
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - zkdoc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zkdoc_app} -d ${POSTGRES_DB:-zkdoc}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - zkdoc-backend-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zkdoc-api
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32M
      - /app/tmp:size=32M
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-zkdoc}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-zkdoc_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-zkdoc_local_dev_secret}
      ZKDOC_STORAGE_TYPE: filesystem
      ZKDOC_STORAGE_DIR: /var/lib/zkdoc/artifacts
      SERVER_PORT: 8080
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - zkdoc_artifacts:/var/lib/zkdoc/artifacts
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - zkdoc-frontend-net
      - zkdoc-backend-net

  # Dedicated Operator Backup Service (Run on demand: docker compose run --rm backup)
  backup:
    image: postgres:16-alpine
    profiles:
      - backup
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zkdoc-backend-net
    volumes:
      - ./backups:/backups
      - zkdoc_artifacts:/data/artifacts:ro
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-zkdoc}
      POSTGRES_USER: ${POSTGRES_USER:-zkdoc_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zkdoc_local_dev_secret}
      BACKUP_DIR: /backups
      ZKDOC_STORAGE_DIR: /data/artifacts
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_HMAC_KEY: ${BACKUP_HMAC_KEY:-}

volumes:
  zkdoc_pgdata:
    driver: local
  zkdoc_artifacts:
    driver: local

networks:
  zkdoc-frontend-net:
    driver: bridge
  zkdoc-backend-net:
    driver: bridge
    internal: true
