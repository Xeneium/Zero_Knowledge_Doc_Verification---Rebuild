spring:
  application:
    name: zkdoc-api
  datasource:
    url: jdbc:sqlite:./data/zkdoc.db
    driver-class-name: org.sqlite.JDBC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

zkdoc:
  public-verification-base-url: ${ZKDOC_PUBLIC_VERIFICATION_BASE_URL:http://localhost:8080}
